# Every Monday, refresh where the example viewers' watchlist films are streaming, and commit it.
# Streamlit Cloud redeploys on the push, so the app always shows availability under a week old.
# Needs a repository secret named TMDB_TOKEN (Settings → Secrets and variables → Actions).

name: Refresh streaming availability

on:
  schedule:
    - cron: "0 5 * * 1"          # Mondays, 05:00 UTC
  workflow_dispatch:              # and a "Run workflow" button, for doing it by hand

permissions:
  contents: write                 # to commit the refreshed files

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install what the script needs
        run: pip install pandas requests python-dotenv

      - name: Refresh streaming availability
        run: python refresh_providers.py
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/*/providers.json
          git diff --cached --quiet || git commit -m "Weekly streaming availability refresh"
          git push
